task: detector
run_name: 20261103-ssdlite320-det-default-baseline-01
output_dir: outputs/detector
device: auto
show_progress: true
# tags:
#   - task:detector
#   - stage:baseline
#   - model:ssdlite320
#   - data:det-default
#   - change:baseline
#   - device:auto

seed: 42

data_factory_path: data_loading.detector:build_detector_inputs
data_settings_path: null

model_name: ssdlite320_mobilenet_v3_large
pretrained_backbone: true

batch_size: 8
max_epochs: 50
learning_rate: 0.005
momentum: 0.9
weight_decay: 0.0005

# 이미지와 bbox에 함께 적용하는 학습 증강 확률/강도
horizontal_flip: 0.0
vertical_flip: 0.0
brightness: 0.0
contrast: 0.0

score_threshold: 0.25
nms_threshold: 0.45
early_stopping_patience: 7
resume_from: null
